<style>
:root{--bg:#F4F6FA;--sf:#FFFFFF;--tx:#0B2545;--mu:#4D5F7A;--ln:rgba(11,37,69,.14);--gd:#C9A227;--gt:#7A5F0C;--hd:rgba(244,246,250,.9);--disc:#0B2545;--chk:#FFFFFF;--cta:#0B2545;--ctx:#FFFFFF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081C37;--sf:#0F2E57;--tx:#FFFFFF;--mu:#A9B8CE;--ln:rgba(255,255,255,.14);--gt:#C9A227;--hd:rgba(8,28,55,.9);--disc:#FFFFFF;--chk:#0B2545;--cta:#0F2E57}}
:root[data-theme="dark"]{--bg:#081C37;--sf:#0F2E57;--tx:#FFFFFF;--mu:#A9B8CE;--ln:rgba(255,255,255,.14);--gt:#C9A227;--hd:rgba(8,28,55,.9);--disc:#FFFFFF;--chk:#0B2545;--cta:#0F2E57}
html{scroll-behavior:smooth;scroll-padding-top:calc(84px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo','Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hd);backdrop-filter:blur(10px)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--hd);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.hr{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.br{display:flex;align-items:center;gap:10px;color:var(--tx);text-decoration:none;font-weight:900;font-size:24px}
.br .logo{width:38px;height:38px}.hr nav a{color:var(--mu);text-decoration:none;font-weight:600;margin-inline:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:12px;background:var(--gd);color:#0B2545;font-weight:700;font-size:16px;line-height:1.2;font-family:inherit;text-decoration:none;border:1px solid var(--gd);cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn.sm{padding:9px 16px;font-size:14px}.btn.ghost{background:transparent;color:var(--tx);border-color:var(--ln)}
:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
.ic{width:18px;height:18px;flex:none}
.hero{display:grid;gap:36px;align-items:center;padding-top:48px;padding-bottom:36px}
.tag{display:inline-block;color:var(--gt);font-weight:700;border:1px solid var(--ln);border-radius:99px;padding:4px 16px;margin-bottom:16px}
h1{font-size:clamp(34px,6.4vw,64px);line-height:1.25;font-weight:900;margin:0 0 16px}h1 em{font-style:normal;color:var(--gt)}
.hero p{font-size:19px;color:var(--mu);margin:0 0 26px;max-width:560px}.row{display:flex;gap:12px;flex-wrap:wrap}.row.c{justify-content:center}
.himg{width:100%;height:auto;border-radius:22px;border:1px solid var(--ln);box-shadow:0 20px 60px rgba(201,162,39,.22)}
@media(min-width:900px){.hero{grid-template-columns:1.05fr 1fr;padding-top:72px}}
.trust{display:grid;gap:12px;padding-bottom:20px}.trust div{display:flex;gap:10px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px 18px;font-weight:600}
.trust .ic,.card li .ic{color:var(--gt)}@media(min-width:760px){.trust{grid-template-columns:repeat(3,1fr)}}
section[id]{padding-top:44px}h2{font-size:clamp(28px,4.4vw,40px);margin:0 0 6px;font-weight:900}.sub{color:var(--mu);margin:0 0 26px;font-size:18px}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.card img,.ph{width:100%;height:auto;aspect-ratio:720/472;object-fit:cover;display:block;background:#0B2545}.ph{display:grid;place-items:center}.ph .logo{width:90px}
.cb{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}.cb h3{margin:0;font-size:22px;font-weight:900}.cb p{margin:0;color:var(--mu)}
.hook{border-inline-start:3px solid var(--gd);padding-inline-start:12px;color:var(--tx)!important;font-weight:600}
.card ul{list-style:none;margin:4px 0 8px;padding:0;display:grid;gap:6px}.card li{display:flex;gap:8px;align-items:center;font-size:15px}.cb .btn{margin-top:auto;align-self:flex-start}
.cta{margin:56px 0 24px;background:var(--cta);color:var(--ctx);border-radius:24px;padding:44px 22px;text-align:center;border:1px solid var(--gd)}
.cta p{color:#C9D3E3;margin:0 0 22px;font-size:18px}.cta h2{color:#fff}
.ft{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--mu);padding:26px 20px 34px}.ft .logo{width:28px;height:28px}
.logo{display:block}
.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:16px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.note{background:#C9A227;color:#0B2545;text-align:center;padding:8px 16px;font-weight:700}
.ap{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(480px,100%);z-index:70;background:var(--sf);color:var(--tx);border-inline-start:1px solid var(--ln);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);box-shadow:0 0 40px rgba(0,0,0,.35)}
.ah,.af{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--ln)}.af{border-top:1px solid var(--ln);border-bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.ab{overflow:auto;padding:8px 16px 20px;flex:1}.ab h4{margin:18px 0 6px;color:var(--gt)}.ab label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}
.ab input,.ab textarea{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
.sv{border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}.ap button{font-family:inherit;cursor:pointer;border:1px solid var(--ln);background:transparent;color:var(--tx);border-radius:8px;padding:7px 12px}
.ap button.pri{background:var(--gd);border-color:var(--gd);color:#0B2545;font-weight:700}#st{font-size:13px;color:var(--mu);flex:1}

:root{--g2:#A5840F}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g2:#E6C85A}}:root[data-theme="dark"]{--g2:#E6C85A}
html,body{overflow-x:clip}
.hd,.card,.trust div,.cta,.chip,.stats div{transition:background-color .35s,border-color .35s,color .35s,transform .3s,box-shadow .3s}
.hd.hide{transform:translateY(-110%)}
.pg{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:3px;background:var(--gd);transform:scaleX(0);transform-origin:100% 50%;z-index:60}
.hr nav{display:none;gap:4px}@media(min-width:760px){.hr nav{display:flex}}
.hr nav a{position:relative;padding:6px 10px;margin:0}.hr nav a::after{content:"";position:absolute;inset-inline:10px;bottom:0;height:2px;background:var(--gd);transform:scaleX(0);transition:transform .3s}
.hr nav a.on{color:var(--tx)}.hr nav a.on::after,.hr nav a:hover::after{transform:scaleX(1)}
.tg{width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);background:transparent;color:var(--tx);display:grid;place-items:center;cursor:pointer;transition:transform .4s}.tg:hover{transform:rotate(90deg)}
.hero{position:relative;isolation:isolate}
.orb{position:absolute;border-radius:50%;filter:blur(64px);z-index:-1;pointer-events:none;translate:0 calc(var(--sy,0)*-.1px)}
.o1{width:340px;height:340px;background:rgba(201,162,39,.3);top:-40px;inset-inline-end:-60px;animation:fl 9s ease-in-out infinite}
.o2{width:300px;height:300px;background:rgba(40,100,190,.32);bottom:-30px;inset-inline-start:-60px;animation:fl 11s ease-in-out infinite reverse}
.w{display:inline-block;animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*80ms + 150ms)}
h1 em .w{background:linear-gradient(90deg,var(--gt),var(--g2),var(--gt));background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards,sh 5s linear infinite;animation-delay:calc(var(--i)*80ms + 150ms),0s}
.tw{perspective:900px}.himg.tilt{transition:transform .25s ease-out,box-shadow .3s;will-change:transform}
.js .rv:not(.in){opacity:0;transform:translateY(28px)}.rv.in{animation:up .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0ms)}
.mq{overflow:hidden;border-block:1px solid var(--ln);padding:14px 0;margin:10px 0 24px}.mt{display:flex;gap:44px;width:max-content;animation:mq 42s linear infinite}.mq:hover .mt{animation-play-state:paused}
.mt span{white-space:nowrap;font-weight:700;color:var(--mu);display:flex;align-items:center;gap:44px}.mt span::after{content:"";width:8px;height:8px;background:var(--gd);transform:rotate(45deg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding-bottom:12px}.stats div{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:18px;text-align:center}
.stats b{display:block;font-size:44px;line-height:1.1;font-weight:900;color:var(--gt)}.stats span{color:var(--mu);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}.chip{padding:8px 20px;border-radius:99px;border:1px solid var(--ln);background:transparent;color:var(--tx);font-family:inherit;font-weight:700;font-size:15px;cursor:pointer}.chip.on{background:var(--gd);border-color:var(--gd);color:#0B2545}
.card{cursor:pointer;position:relative}.card:hover{box-shadow:0 18px 44px rgba(11,37,69,.25);border-color:var(--gd)}.card.pop{animation:pop .45s cubic-bezier(.2,.8,.2,1) backwards}.card[hidden]{display:none}
.im{overflow:hidden}.im img,.im .ph{transition:transform .6s}.card:hover .im img{transform:scale(1.07)}
.fl{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;z-index:55}
.fb{width:52px;height:52px;border-radius:50%;background:var(--gd);color:#0B2545;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3);position:relative;transition:transform .2s}.fb:hover{transform:scale(1.1)}
.fb .ic{width:24px;height:24px}.fb:first-child::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--gd);animation:pl 2s ease-out infinite}
.md{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(4,14,30,.72);backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}.md[hidden]{display:none}.md.show{opacity:1}
.mc{position:relative;width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--sf);color:var(--tx);border:1px solid var(--gd);border-radius:22px;transform:translateY(30px) scale(.96);transition:transform .35s cubic-bezier(.2,.8,.2,1)}.md.show .mc{transform:none}
.mc>img{width:100%;height:auto;display:block}.mb{padding:20px;display:grid;gap:10px}.mb h3{margin:0;font-size:24px;font-weight:900}.mb p{margin:0;color:var(--mu)}.mb ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}.mb li{display:flex;gap:8px;align-items:center}.mb li .ic{color:var(--gt)}
.x{position:absolute;top:10px;inset-inline-start:10px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:rgba(11,37,69,.8);color:#fff;font-size:24px;line-height:1;cursor:pointer}
@keyframes up{from{opacity:0;transform:translateY(28px)}}@keyframes rise{from{opacity:0;transform:translateY(40px) rotate(3deg)}}@keyframes pop{from{opacity:0;transform:scale(.92)}}
@keyframes fl{50%{transform:translate(24px,-28px) scale(1.08)}}@keyframes sh{to{background-position:-220% 0}}@keyframes mq{to{transform:translateX(50%)}}@keyframes pl{to{transform:scale(1.7);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.js .rv:not(.in){opacity:1;transform:none}}
</style>

function theme(){const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'),n=cur==='dark'?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('itq-theme',n)}catch(e){}}
try{const sv=localStorage.getItem('itq-theme');if(sv)document.documentElement.dataset.theme=sv}catch(e){}
document.addEventListener('click',e=>{if(e.target.closest('[data-t]')){theme();return}const c=e.target.closest('.chip');if(c){filt(c);return}if(e.target.closest('[data-m]')||e.target.id==='md'){closeM();return}const o=e.target.closest('[data-open]');if(o&&!e.target.closest('a'))openM(+o.dataset.open)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();const o=e.target.closest&&e.target.closest('[data-open]');if(o&&e.target===o&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openM(+o.dataset.open)}});
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||RM)return;const t=e.target.closest('.tilt,.card'),m=e.target.closest('.btn,.fb');
 if(t){const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5,k=t.classList.contains('tilt')?10:4;t.style.transform=`perspective(900px) rotateY(${x*k}deg) rotateX(${-y*k}deg)`}
 if(m){const r=m.getBoundingClientRect();m.style.transform=`translate(${((e.clientX-r.left)/r.width-.5)*8}px,${((e.clientY-r.top)/r.height-.5)*8}px)`}});
document.addEventListener('pointerout',e=>{const t=e.target.closest&&e.target.closest('.tilt,.card,.btn,.fb');if(t&&!t.contains(e.relatedTarget))t.style.transform=''});
const paint=()=>{$('#app').innerHTML=render();fx();if(admin)note()};
const note=()=>{const h=chans().length?'':'<div class="note">لم تُضف وسائل التواصل بعد. افتح «تعديل الموقع» وأضفها لتظهر أزرار الطلب للزوار.</div>';const o=$('#app');if(h)o.insertAdjacentHTML('afterbegin',h)};
function panel(){const f=(p,l,v,r)=>`<label>${l}${r?`<textarea data-f="${p}" rows="${r}">${esc(v)}</textarea>`:`<input data-f="${p}" value="${esc(v)}">`}</label>`,c=D.contact||{};
return `<div class="ap"><div class="ah"><b>تعديل الموقع</b><button data-a="close">إغلاق</button></div><div class="ab"><h4>عام</h4>${f('brand','اسم العلامة',D.brand)}${f('tagline','الوسم أعلى العنوان',D.tagline)}${f('heroTitle','العنوان الرئيسي',D.heroTitle)}${f('heroHighlight','الجزء الذهبي من العنوان',D.heroHighlight)}${f('heroSub','وصف مختصر',D.heroSub,3)}${f('servicesSub','وصف قسم الخدمات',D.servicesSub)}
<h4>وسائل التواصل</h4>${f('contact.whatsapp','رقم واتساب مع رمز الدولة، مثل 9647XXXXXXXXX',c.whatsapp)}${f('contact.telegram','معرّف تيليجرام أو الرابط',c.telegram)}${f('contact.phone','رقم الاتصال',c.phone)}
<h4>الخدمات</h4>${D.services.map((s,i)=>`<div class="sv"><b>${i+1}</b>${f('services.'+i+'.title','العنوان',s.title)}${f('services.'+i+'.hook','سطر المشكلة',s.hook)}${f('services.'+i+'.promise','الوعد',s.promise,2)}${f('services.'+i+'.bullets','الدليل (نقطة في كل سطر)',(s.bullets||[]).join('\n'),3)}<div class="row"><button data-a="up" data-i="${i}">أعلى</button><button data-a="dn" data-i="${i}">أسفل</button><button data-a="del" data-i="${i}">حذف</button></div></div>`).join('')}<button data-a="add">إضافة خدمة</button>
<h4>الدعوة والتذييل</h4>${f('ctaTitle','عنوان الدعوة للتواصل',D.ctaTitle)}${f('ctaSub','نص الدعوة',D.ctaSub)}${f('footer','نص التذييل',D.footer)}</div><div class="af"><span id="st"></span><button data-a="reset">تراجع</button><button class="pri" data-a="save">حفظ ونشر</button></div></div>`}
const fab='<button class="btn fab" data-a="open">تعديل الموقع</button>';
function setPath(o,p,v){const k=p.split('.');for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}
function collect(){document.querySelectorAll('[data-f]').forEach(e=>{let v=e.value;if(e.dataset.f.endsWith('.bullets'))v=v.split('\n').map(x=>x.trim()).filter(Boolean);setPath(D,e.dataset.f,v)})}
function buildDoc(){const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML=render();c.querySelector('#admin-root').innerHTML='';c.querySelector('#site-data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');c.removeAttribute('data-theme');return '<!doctype html>\n'+c.outerHTML}
async function save(){collect();const st=$('#st');st.textContent='جارٍ الحفظ…';try{const a=await claude.use('artifact');if(!a){st.textContent='الحفظ غير متاح في هذا العرض';return}await a.publish(buildDoc())}catch(e){st.textContent=e&&e.code==='conflict'?'تغيّرت الصفحة من مكان آخر، أعد المحاولة':'تعذّر الحفظ، حاول مرة أخرى'}}
let tm;document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.f){clearTimeout(tm);tm=setTimeout(()=>{collect();paint()},250)}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||!admin)return;const a=b.dataset.a,i=+b.dataset.i,s=D.services,r=$('#admin-root');
 if(a==='open'){r.innerHTML=panel();return}if(a==='close'){collect();r.innerHTML=fab;return}if(a==='save'){save();return}
 collect();
 if(a==='reset'){D=JSON.parse(ORIG)}else if(a==='del'){s.splice(i,1)}else if(a==='up'&&i>0){[s[i-1],s[i]]=[s[i],s[i-1]]}else if(a==='dn'&&i<s.length-1){[s[i+1],s[i]]=[s[i],s[i+1]]}else if(a==='add'){s.push({id:'s'+Date.now(),title:'خدمة جديدة',hook:'',promise:'',bullets:[],img:''})}
 r.innerHTML=panel();paint()});
paint();
(async()=>{try{const u=window.claude&&await claude.use('user');if(u&&u.canEdit()){admin=true;$('#admin-root').innerHTML=fab;note()}}catch(e){}})();
})();
</script>
</body>
</html>
